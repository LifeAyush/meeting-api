name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system deps
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default Linux wheel pulls ~2 GB of CUDA libraries.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Generate fixture WAV
        run: python scripts/gen_fixture_wav.py
      - name: Test
        env:
          SUMMARY_MODE: mock
          WHISPER_MODEL: tiny
        run: pytest -q
